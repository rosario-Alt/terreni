; rb.ftv — configurazione del server di supporto (copia questo file in config.ini)

[server]
; porta su cui il server espone la piattaforma (http://localhost:8765/)
porta = 8765

[archivio]
; cartella archivio pratiche: la stessa che colleghi nel tool (scheda Archivio & Registro)
; su Windows ad esempio:  C:\analisi
percorso = C:\analisi

[mail]
; casella dedicata alle richieste X-Elio (es. xelio.rbftv@gmail.com)
; per Gmail: attiva la verifica in due passaggi e crea una "password per le app"
; https://myaccount.google.com/apppasswords  — usa quella qui sotto
imap_host = imap.gmail.com
imap_utente = xelio.rbftv@gmail.com
imap_password = xxxx xxxx xxxx xxxx

; scarica solo le mail il cui mittente contiene questo testo (vuoto = tutte)
filtro_mittente = x-elio

; ogni quanti minuti controllare la casella (0 = solo manuale via POST /api/mail/controlla)
intervallo_minuti = 5
